name: Live transition check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/live.yml', 'live_check.py', 'agent_nodes.py']
permissions:
  contents: read
jobs:
  transition:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python live_check.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
